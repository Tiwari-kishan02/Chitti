<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Chitti - AI Assistant</title>
<style>
  :root { --bg:#0b1220; --panel:#111a2e; --line:#1e2a44; --text:#e2e8f0;
          --muted:#8da2c0; --accent:#22d3ee; --user:#2563eb; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; font-family:"Segoe UI",Arial,sans-serif; background:var(--bg);
         color:var(--text); display:flex; justify-content:center; }
  .app { width:100%; max-width:760px; height:100dvh; display:flex; flex-direction:column; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:12px; }
  .logo { width:42px; height:42px; border-radius:12px; background:var(--panel);
          border:1px solid var(--accent); display:flex; align-items:center;
          justify-content:center; font-size:22px; box-shadow:0 0 12px rgba(34,211,238,.35); }
  header h1 { margin:0; font-size:19px; letter-spacing:.5px; }
  header p { margin:2px 0 0; font-size:12px; color:var(--muted); }
  #chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:88%; padding:10px 14px; border-radius:14px; line-height:1.5;
         word-break:break-word; font-size:15px; }
  .bot { background:var(--panel); align-self:flex-start; border:1px solid var(--line); }
  .user { background:var(--user); align-self:flex-end; white-space:pre-wrap; }
  .safe { border-left:4px solid #22c55e; }
  .bad { border-left:4px solid #ef4444; }
  .note { font-size:13px; color:var(--muted); margin-top:8px; white-space:pre-wrap; }
  .msg code { background:#0b1220; padding:1px 5px; border-radius:5px; font-size:13px; }
  .code { margin:8px 0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#070d19; }
  .codebar { display:flex; justify-content:space-between; align-items:center; padding:4px 10px;
             background:#0f1a30; font-size:12px; color:var(--muted); }
  .copy { background:transparent; border:1px solid var(--line); color:var(--text);
          border-radius:6px; padding:2px 8px; cursor:pointer; font-size:12px; }
  pre { margin:0; padding:10px 12px; overflow-x:auto; }
  pre code { background:none; padding:0; font-size:13px; }
  form { display:flex; gap:8px; padding:12px 18px; border-top:1px solid var(--line); align-items:flex-end; }
  textarea { flex:1; resize:none; max-height:140px; padding:11px 13px; border-radius:12px;
             border:1px solid var(--line); background:var(--panel); color:var(--text);
             font-size:15px; font-family:inherit; }
  textarea:focus { outline:none; border-color:var(--accent); }
  button.send { padding:11px 18px; border:0; border-radius:12px; background:var(--accent);
                color:#04222a; font-weight:600; font-size:15px; cursor:pointer; }
  button.send:disabled { opacity:.5; cursor:default; }
  footer { text-align:center; font-size:11px; color:#5f7394; padding:0 14px 10px; }

  /* ---------- robotic boot intro ---------- */
  #boot { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
          align-items:center; justify-content:center; gap:20px; padding:24px;
          background:radial-gradient(circle at 50% 35%, #0e2238 0%, #050a14 70%);
          transition:opacity .6s ease; }
  #boot.hide { opacity:0; pointer-events:none; }
  .face { position:relative; width:160px; height:124px; border-radius:30px; overflow:hidden;
          border:2px solid var(--accent); background:#0b1626; display:flex;
          align-items:center; justify-content:center; gap:28px;
          box-shadow:0 0 34px rgba(34,211,238,.35); }
  .eye { width:26px; height:26px; border-radius:50%; background:var(--accent);
         box-shadow:0 0 14px var(--accent); transform:scaleY(.08); transition:transform .5s ease; }
  .face.awake .eye { transform:scaleY(1); animation:blink 4s infinite; }
  @keyframes blink { 0%,92%,100% { transform:scaleY(1); } 96% { transform:scaleY(.1); } }
  .scan { position:absolute; left:0; right:0; height:3px; background:rgba(34,211,238,.55);
          animation:scan 2.2s linear infinite; }
  @keyframes scan { 0% { top:-4px; } 100% { top:100%; } }
  .bootlog { width:min(460px,100%); min-height:150px; font-family:Consolas,"Courier New",monospace;
             font-size:13px; line-height:1.7; color:var(--accent); }
  .bootlog div { white-space:pre-wrap; }
  .hello { min-height:36px; font-size:26px; font-weight:700; letter-spacing:1px; text-align:center; }
  .startbtn { opacity:0; pointer-events:none; transition:opacity .4s ease; padding:12px 34px;
              border-radius:999px; border:1px solid var(--accent); background:transparent;
              color:var(--accent); font-size:15px; letter-spacing:3px; cursor:pointer;
              box-shadow:0 0 16px rgba(34,211,238,.35); }
  .startbtn.show { opacity:1; pointer-events:auto; }
  .startbtn:hover { background:rgba(34,211,238,.12); }
  .skip { position:absolute; bottom:18px; right:20px; background:none; border:0;
          color:var(--muted); cursor:pointer; font-size:13px; }
</style>
</head>
<body>

<div id="boot">
  <div class="face" id="face">
    <div class="scan"></div>
    <div class="eye"></div>
    <div class="eye"></div>
  </div>
  <div class="bootlog" id="bootlog"></div>
  <div class="hello" id="hello"></div>
  <button class="startbtn" id="start" type="button">START</button>
  <button class="skip" id="skip" type="button">Skip intro</button>
</div>

<div class="app">
  <header>
    <div class="logo">&#129302;</div>
    <div>
      <h1>CHITTI</h1>
      <p>AI assistant by Kishan Tiwari &middot; Speed 1 THz &middot; Memory 1 ZB</p>
    </div>
  </header>

  <div id="chat"></div>

  <form id="form">
    <textarea id="input" rows="1" maxlength="4000"
      placeholder="Ask in English, हिंदी or Hinglish..."></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
  <footer>Chitti can make mistakes. Never share real passwords, OTPs or card details here.</footer>
</div>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  let history = [];

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function render(text) {
    const parts = text.split("```");
    let html = "";
    parts.forEach((part, i) => {
      if (i % 2 === 1) {
        const nl = part.indexOf("\n");
        const lang = nl > -1 ? part.slice(0, nl).trim() : "";
        const code = nl > -1 ? part.slice(nl + 1) : part;
        html += '<div class="code"><div class="codebar"><span>' +
          escapeHtml(lang || "code") +
          '</span><button class="copy" type="button">Copy</button></div><pre><code>' +
          escapeHtml(code.replace(/\n$/, "")) + "</code></pre></div>";
      } else {
        let t = escapeHtml(part);
        t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
        t = t.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
        html += t.replace(/\n/g, "<br>");
      }
    });
    return html;
  }

  function addUser(text) {
    const div = document.createElement("div");
    div.className = "msg user";
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function addBot(text, status, notes) {
    const div = document.createElement("div");
    div.className = "msg bot" + (status === "bad" ? " bad" : status === "safe" ? " safe" : "");
    div.innerHTML = render(text);
    if (notes) {
      const n = document.createElement("div");
      n.className = "note";
      n.textContent = notes.split(" | ").join("\n");
      div.appendChild(n);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  chat.addEventListener("click", (e) => {
    if (!e.target.classList.contains("copy")) return;
    const code = e.target.closest(".code").querySelector("code").textContent;
    navigator.clipboard.writeText(code).then(() => {
      e.target.textContent = "Copied";
      setTimeout(() => { e.target.textContent = "Copy"; }, 1500);
    });
  });

  async function send(text) {
    addUser(text);
    sendBtn.disabled = true;
    const thinking = addBot("Thinking...");

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: history.slice(-10) })
      });
      const data = await res.json();
      thinking.remove();

      if (!res.ok) {
        addBot(data.detail || "Something went wrong. Please try again.");
      } else {
        addBot(data.reply, data.status, data.notes);
        history.push({ role: "user", content: text });
        history.push({ role: "assistant", content: data.reply });
        history = history.slice(-12);
      }
    } catch (err) {
      thinking.remove();
      addBot("I could not reach the server. Please check your connection and try again.");
    }
    sendBtn.disabled = false;
    input.focus();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = "";
    input.style.height = "auto";
    send(text);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  /* ---------- boot intro ---------- */
  const boot = document.getElementById("boot");
  const face = document.getElementById("face");
  const bootlog = document.getElementById("bootlog");
  const hello = document.getElementById("hello");
  const startBtn = document.getElementById("start");
  let bootActive = true;
  let entered = false;

  const BOOT_LINES = [
    "> INITIALIZING CHITTI ...",
    "> SPEED ............ 1 TERAHERTZ",
    "> MEMORY ........... 1 ZETTABYTE",
    "> LOADING SECURITY MODULES ... OK",
    "> LANGUAGES: ENGLISH | HINDI | HINGLISH ... OK",
    "> ALL SYSTEMS ONLINE"
  ];

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function typeInto(el, text, speed) {
    for (let i = 1; i <= text.length; i++) {
      if (!bootActive) return;
      el.textContent = text.slice(0, i);
      await sleep(speed);
    }
  }

  async function runBoot() {
    await sleep(400);
    face.classList.add("awake");
    await sleep(700);
    for (const line of BOOT_LINES) {
      if (!bootActive) return;
      const div = document.createElement("div");
      bootlog.appendChild(div);
      await typeInto(div, line, 14);
      await sleep(160);
    }
    if (!bootActive) return;
    await typeInto(hello, "Hi, I am Chitti.", 60);
    startBtn.classList.add("show");
    startBtn.focus();
  }

  function enterChat() {
    if (entered) return;
    entered = true;
    bootActive = false;
    boot.classList.add("hide");
    setTimeout(() => { boot.style.display = "none"; }, 650);
    addBot("Hi, I am Chitti. You can talk to me in English, Hindi (हिंदी) or Hinglish. Ask me about studies, code, history, or send a link, password or message to check.");
    input.focus();
  }

  startBtn.addEventListener("click", enterChat);
  document.getElementById("skip").addEventListener("click", enterChat);
  document.addEventListener("keydown", (e) => {
    if (!entered && e.key === "Enter") enterChat();
  });

  runBoot();
</script>
</body>
</html>
