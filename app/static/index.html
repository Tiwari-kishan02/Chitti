<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chitti - AI Security Assistant</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #0f172a;
         color: #e2e8f0; display: flex; justify-content: center; height: 100vh; }
  .app { width: 100%; max-width: 720px; display: flex; flex-direction: column; height: 100%; }
  header { padding: 16px 20px; border-bottom: 1px solid #1e293b; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; color: #94a3b8; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.45;
         white-space: pre-wrap; word-break: break-word; }
  .bot { background: #1e293b; align-self: flex-start; }
  .user { background: #2563eb; align-self: flex-end; }
  .safe { border-left: 4px solid #22c55e; }
  .bad { border-left: 4px solid #ef4444; }
  .small { font-size: 13px; color: #94a3b8; margin-top: 6px; }
  form { display: flex; gap: 8px; padding: 16px; border-top: 1px solid #1e293b; }
  input { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #334155;
          background: #0b1220; color: #e2e8f0; font-size: 15px; }
  button { padding: 12px 18px; border: 0; border-radius: 10px; background: #2563eb;
           color: white; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  footer { text-align: center; font-size: 12px; color: #64748b; padding: 0 16px 12px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Chitti</h1>
    <p>AI security assistant: paste a link and I will check if it looks like phishing</p>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Paste a link or message here..." autocomplete="off">
    <button id="send" type="submit">Check</button>
  </form>
  <footer>Chitti is a machine learning model. It can make mistakes, so stay careful.</footer>
</div>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const btn = document.getElementById("send");
  const URL_REGEX = /(?:https?:\/\/)?(?:[a-z0-9-]+\.)+[a-z]{2,}(?:[\/?#]\S*)?/gi;

  function addMessage(text, who, extraClass, note) {
    const div = document.createElement("div");
    div.className = "msg " + who + (extraClass ? " " + extraClass : "");
    div.textContent = text;
    if (note) {
      const s = document.createElement("div");
      s.className = "small";
      s.textContent = note;
      div.appendChild(s);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function checkUrl(url) {
    const res = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: url })
    });
    if (!res.ok) throw new Error("Server error");
    return res.json();
  }

  addMessage("Hi, I am Chitti. Paste any link (or a message that has a link) and I will check it for phishing.", "bot");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, "user");
    input.value = "";

    const urls = text.match(URL_REGEX);
    if (!urls) {
      addMessage("I could not find a link in your message. Paste a URL and I will check it.", "bot");
      return;
    }

    btn.disabled = true;
    for (const u of urls.slice(0, 5)) {
      try {
        const r = await checkUrl(u);
        const pct = Math.round(r.phishing_probability * 100);
        const bad = r.verdict === "PHISHING";
        const title = bad
          ? "Dangerous: " + u + "\nThis looks like PHISHING (" + pct + "% risk). Do not open it or enter any details."
          : "Looks safe: " + u + "\nRisk score " + pct + "%. Still, be careful with links you did not expect.";
        const note = r.reasons.length ? "What I noticed: " + r.reasons.join("; ") : null;
        addMessage(title, "bot", bad ? "bad" : "safe", note);
      } catch (err) {
        addMessage("Something went wrong. Please try again.", "bot");
      }
    }
    btn.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
